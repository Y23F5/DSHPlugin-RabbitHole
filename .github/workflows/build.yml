name: Build plugin preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: DSHPlugin-RabbitHole-preview
          path: '*.tgz'
          if-no-files-found: error
